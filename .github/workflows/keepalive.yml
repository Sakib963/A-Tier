# Keeps the free Supabase project awake. It pauses after 7 days idle, and we
# only play once a week, so a ping every 3 days is enough.
name: Keepalive

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the site
        run: |
          if [ -z "${{ secrets.KEEPALIVE_URL }}" ]; then
            echo "KEEPALIVE_URL secret is not set. Skipping."
            exit 0
          fi
          curl -sSf --retry 3 --retry-delay 10 "${{ secrets.KEEPALIVE_URL }}/api/ping"
